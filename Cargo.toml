[package]
name = "cesura"
version = "0.8.0"
edition = "2021"
license = "Apache-2.0"
description = "Bayesian Online Change Point Detection (Adams & MacKay 2007) with NIG conjugate prior, plus the Chen & Wu (2025) joint CP + collective-anomaly detector"
repository = "https://github.com/JamieAP/cesura"
readme = "README.md"
keywords = ["bayesian", "changepoint", "anomaly", "timeseries", "online"]
categories = ["science", "mathematics", "algorithms"]
rust-version = "1.87"

[features]
default = ["joint-detection", "robust", "cli"]
test-utils = ["dep:polars"]
robust = []
joint-detection = []
cli = ["dep:clap", "dep:anyhow"]
mcp = ["dep:rmcp", "dep:tokio", "dep:dashmap", "dep:uuid", "dep:tracing", "dep:tracing-subscriber", "dep:schemars"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
polars = { version = "0.50", default-features = false, features = ["parquet", "lazy", "diff", "log", "dtype-decimal", "dtype-datetime", "dtype-date"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }
anyhow = { version = "1", optional = true }
rmcp = { version = "1.6", features = ["server", "transport-io", "macros"], optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "sync"], optional = true }
dashmap = { version = "6", optional = true }
uuid = { version = "1", features = ["v4", "serde"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
schemars = { version = "1", optional = true }

[[bin]]
name = "cesura"
path = "src/bin/cesura.rs"
required-features = ["cli"]

[[bin]]
name = "cesura-mcp"
path = "src/bin/cesura_mcp.rs"
required-features = ["mcp"]

[dev-dependencies]
changepoint = "0.15"
rv = "0.19"
criterion = "0.8"
proptest = "1.4"
assert_cmd = "2"

[[test]]
name = "statistical"
required-features = ["test-utils"]

[[test]]
name = "state_compat"
required-features = ["test-utils"]

[[test]]
name = "correctness"
required-features = ["test-utils"]

[[test]]
name = "concurrency"
required-features = ["test-utils"]

[[test]]
name = "resilience"
required-features = ["test-utils"]

[[test]]
name = "properties"
required-features = ["test-utils"]

[[test]]
name = "focus"
required-features = ["test-utils"]

[[test]]
name = "bench"
required-features = ["test-utils"]

[[test]]
name = "chen_wu"
required-features = ["test-utils", "joint-detection"]

[[test]]
name = "streaming_chen_wu"
required-features = ["test-utils", "joint-detection"]

[[test]]
name = "multistream"
required-features = ["test-utils"]

[[test]]
name = "dm_bocd_coverage"
required-features = ["test-utils"]

[[test]]
name = "dm_bocd_properties"
required-features = ["test-utils"]

[[test]]
name = "cli_watch"
required-features = ["cli"]

[[test]]
name = "mcp_smoke"
required-features = ["mcp", "test-utils"]

[[bench]]
name = "focus_pruning"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "conformal_overhead"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "detectors_throughput"
harness = false
required-features = ["test-utils"]


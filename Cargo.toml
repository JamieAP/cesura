[package]
name = "cesura"
version = "0.8.0"
edition = "2021"
license = "Apache-2.0"
description = "Bayesian Online Change Point Detection (Adams & MacKay 2007) with NIG conjugate prior, plus the Chen & Wu (2025) joint CP + collective-anomaly detector"
repository = "https://github.com/JamieAP/cesura"
readme = "README.md"
keywords = ["bayesian", "changepoint", "anomaly", "timeseries", "online"]
categories = ["science", "mathematics", "algorithms"]
rust-version = "1.87"

[features]
default = ["joint-detection", "robust"]
test-utils = []
robust = []
joint-detection = []

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
changepoint = "0.15"
rv = "0.19"
criterion = "0.5"

[[test]]
name = "statistical"
required-features = ["test-utils"]

[[test]]
name = "state_compat"
required-features = ["test-utils"]

[[test]]
name = "correctness"
required-features = ["test-utils"]

[[test]]
name = "concurrency"
required-features = ["test-utils"]

[[test]]
name = "resilience"
required-features = ["test-utils"]

[[test]]
name = "properties"
required-features = ["test-utils"]

[[test]]
name = "focus"
required-features = ["test-utils"]

[[test]]
name = "chen_wu"
required-features = ["test-utils", "joint-detection"]

[[test]]
name = "streaming_chen_wu"
required-features = ["test-utils", "joint-detection"]

[[bench]]
name = "focus_pruning"
harness = false
required-features = ["test-utils"]

[package]
name = "bocpd"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Bayesian Online Change Point Detection (Adams & MacKay 2007) with NIG conjugate prior"
repository = "https://github.com/JamieAP/bocpd"
readme = "README.md"
keywords = ["bayesian", "changepoint", "anomaly", "timeseries", "online"]
categories = ["science", "mathematics", "algorithms"]
rust-version = "1.87"

[features]
test-utils = []

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[[test]]
name = "statistical"
required-features = ["test-utils"]

[[test]]
name = "state_compat"
required-features = ["test-utils"]

[[test]]
name = "correctness"
required-features = ["test-utils"]

[[test]]
name = "concurrency"
required-features = ["test-utils"]

[[test]]
name = "resilience"
required-features = ["test-utils"]
